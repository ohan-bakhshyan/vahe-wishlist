<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vahe's Wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            hwBlue: '#0057B8',
            hwOrange: '#FF6B00',
            hwOrangeHover: '#E05A00',
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
    }

    /* Mobile: show one product per mobile screen with smooth scroll-down */
    @media (max-width: 639px) {
      html {
        scroll-snap-type: y proximity;
      }
      .gift-card {
        min-height: 76svh;
        scroll-snap-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .gift-photo-wrap {
        height: 60svh;
        aspect-ratio: auto !important;
      }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased flex flex-col items-center py-6 sm:py-10 px-4 sm:px-6 lg:px-8">

  <main class="w-full max-w-5xl mx-auto space-y-6 sm:space-y-8">

    <!-- 1. Simple Header / Short Intro -->
    <header class="text-center space-y-3 pt-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
        Vahe's Wishlist
      </h1>
      <!-- Subtle Hot Wheels blue-orange accent bar -->
      <div class="flex items-center justify-center gap-1.5 py-1" aria-hidden="true">
        <span class="h-1.5 w-12 rounded-full bg-hwBlue"></span>
        <span class="h-1.5 w-4 rounded-full bg-slate-200"></span>
        <span class="h-1.5 w-12 rounded-full bg-hwOrange"></span>
      </div>
      <p class="text-slate-600 text-sm sm:text-base max-w-lg mx-auto leading-relaxed">
        Welcome! Browse the gift photos below and select the one you would like to gift for Vahe. Each gift can only have one selection.
      </p>
    </header>

    <!-- 2. General Count / Progress Box (for Mama & guests) -->
    <section aria-label="Wishlist Progress" class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/80 shadow-sm max-w-2xl mx-auto w-full sticky top-3 z-30 backdrop-blur-md bg-white/95">
      <div class="flex items-center justify-between text-xs sm:text-sm font-semibold tracking-wide text-slate-700 mb-3 px-1">
        <div>Total Gifts: <span id="totalCount" class="font-bold text-slate-900">21</span></div>
        <div class="text-slate-300">|</div>
        <div>Selected: <span id="claimedCount" class="font-bold text-hwOrange">0</span></div>
        <div class="text-slate-300">|</div>
        <div>Available: <span id="availableCount" class="font-bold text-hwBlue">21</span></div>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200/60">
        <div id="progressBar" class="bg-hwOrange h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Mobile scroll-down cue -->
    <div class="sm:hidden text-center pb-1">
      <a href="#giftGrid" class="inline-flex items-center gap-1.5 text-xs font-semibold text-hwBlue bg-blue-50 px-3.5 py-1.5 rounded-full border border-blue-100">
        Scroll down to browse gifts
        <span aria-hidden="true">↓</span>
      </a>
    </div>

    <!-- 3. Pure Photo Grid (1 per screen on mobile, 3 on tablet, 4 on desktop) -->
    <section id="giftGrid" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-6 sm:gap-5 pb-10">
      <!-- Populated dynamically from the 21 gift images -->
    </section>

  </main>

  <!-- 4. Confirmation & Switch Selection Modal -->
  <div id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="modalMessage" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-slate-900/45 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center space-y-5 border border-slate-100">
      <p id="modalMessage" class="text-base sm:text-lg font-bold text-slate-800 leading-snug">
        Are you sure you will gift this one?
      </p>
      <div class="flex items-center justify-center gap-3 pt-1">
        <button id="modalNoBtn" type="button" class="w-full py-2.5 px-4 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold text-sm transition">
          No
        </button>
        <button id="modalYesBtn" type="button" class="w-full py-2.5 px-4 rounded-xl bg-hwOrange hover:bg-hwOrangeHover text-white font-semibold text-sm transition shadow-sm">
          Yes
        </button>
      </div>
    </div>
  </div>

  <!-- Optional Clean Photo Lightbox (tap image to view full size) -->
  <div id="lightboxModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" onclick="closeLightbox()">
    <button type="button" aria-label="Close preview" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/90 text-slate-800 font-bold text-xl flex items-center justify-center shadow-md hover:bg-white" onclick="closeLightbox()">×</button>
    <img id="lightboxImg" src="" alt="Gift photo" class="max-h-[88svh] max-w-[94vw] rounded-xl object-contain shadow-2xl" onclick="event.stopPropagation()">
  </div>

  <script>
    const TOTAL_ITEMS = 21;
    const COOKIE_NAME = 'vahe_wishlist_gift';
    const STORAGE_KEY = 'vahe_wishlist_gift_backup';

    const ITEMS = Array.from({ length: TOTAL_ITEMS }, (_, idx) => {
      const num = idx + 1;
      return {
        id: String(num),
        src: `items%20for%20gifting/photo_${num}_2026-11-26_12-18-33.jpg`
      };
    });

    function setCookie(name, value, days) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      try {
        localStorage.setItem(STORAGE_KEY, value);
      } catch (_) {}
    }

    function clearCookie(name) {
      document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; path=/; SameSite=Lax`;
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
    }

    function getCookie(name) {
      const cookies = document.cookie ? document.cookie.split('; ') : [];
      for (const part of cookies) {
        const eqIdx = part.indexOf('=');
        const key = eqIdx > -1 ? part.slice(0, eqIdx) : part;
        if (key === name) {
          return decodeURIComponent(part.slice(eqIdx + 1));
        }
      }
      try {
        return localStorage.getItem(STORAGE_KEY) || null;
      } catch (_) {
        return null;
      }
    }

    let selectedGiftId = getCookie(COOKIE_NAME);
    if (selectedGiftId && !ITEMS.some(item => item.id === selectedGiftId)) {
      selectedGiftId = null;
    }
    let pendingGiftId = null;
    let pendingAction = null;

    function updateCounts() {
      const claimed = selectedGiftId ? 1 : 0;
      const available = TOTAL_ITEMS - claimed;
      const pct = ((claimed / TOTAL_ITEMS) * 100).toFixed(1);

      document.getElementById('totalCount').textContent = String(TOTAL_ITEMS);
      document.getElementById('claimedCount').textContent = String(claimed);
      document.getElementById('availableCount').textContent = String(available);
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function renderGrid() {
      const grid = document.getElementById('giftGrid');
      grid.innerHTML = '';

      ITEMS.forEach(item => {
        const isSelected = selectedGiftId === item.id;

        const card = document.createElement('div');
        card.className = isSelected
          ? 'gift-card bg-blue-50/40 rounded-2xl border-2 border-hwBlue shadow-sm p-3.5 sm:p-3 flex flex-col space-y-3 ring-4 ring-hwBlue/10 transition'
          : 'gift-card bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 sm:p-3 flex flex-col space-y-3 transition hover:border-slate-300';

        const photoWrap = document.createElement('div');
        photoWrap.className = 'gift-photo-wrap aspect-square w-full rounded-xl overflow-hidden bg-slate-50 flex items-center justify-center p-1.5 cursor-zoom-in';

        const img = document.createElement('img');
        img.src = item.src;
        img.alt = `Wishlist item ${item.id}`;
        img.loading = Number(item.id) <= 4 ? 'eager' : 'lazy';
        img.className = 'w-full h-full object-contain rounded-lg select-none';
        photoWrap.onclick = () => openLightbox(img.src);

        photoWrap.appendChild(img);

        const btn = document.createElement('button');
        btn.type = 'button';
        if (isSelected) {
          btn.className = 'w-full py-3 sm:py-2.5 px-4 bg-hwBlue hover:bg-blue-800 active:scale-[0.99] text-white font-semibold text-base sm:text-sm rounded-xl transition duration-150 flex items-center justify-center gap-1.5 shadow-sm';
          btn.textContent = 'Selected ✓ (Deselect)';
          btn.onclick = () => requestDeselectGift();
        } else {
          btn.className = 'w-full py-3 sm:py-2.5 px-4 bg-hwOrange hover:bg-hwOrangeHover active:scale-[0.99] text-white font-semibold text-base sm:text-sm rounded-xl transition duration-150 shadow-sm';
          btn.textContent = 'Select';
          btn.onclick = () => requestSelectGift(item.id);
        }

        card.appendChild(photoWrap);
        card.appendChild(btn);
        grid.appendChild(card);
      });

      updateCounts();
    }

    function requestSelectGift(id) {
      if (selectedGiftId === id) return;
      pendingGiftId = id;
      pendingAction = 'select';

      const modalMessage = document.getElementById('modalMessage');
      if (selectedGiftId !== null) {
        modalMessage.textContent = 'If you select this one, the previous selection will be lost';
      } else {
        modalMessage.textContent = 'Are you sure you will gift this one?';
      }

      const modal = document.getElementById('confirmModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function requestDeselectGift() {
      if (!selectedGiftId) return;
      pendingGiftId = null;
      pendingAction = 'deselect';

      document.getElementById('modalMessage').textContent = 'Are you sure you want to deselect this gift?';
      const modal = document.getElementById('confirmModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      pendingGiftId = null;
      pendingAction = null;
      const modal = document.getElementById('confirmModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmGift() {
      if (pendingAction === 'deselect') {
        selectedGiftId = null;
        clearCookie(COOKIE_NAME);
        closeModal();
        renderGrid();
        return;
      }
      if (!pendingGiftId) return;
      selectedGiftId = pendingGiftId;
      setCookie(COOKIE_NAME, selectedGiftId, 365);
      closeModal();
      renderGrid();
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightboxModal');
      document.getElementById('lightboxImg').src = src;
      lb.classList.remove('hidden');
      lb.classList.add('flex');
    }

    function closeLightbox() {
      const lb = document.getElementById('lightboxModal');
      lb.classList.add('hidden');
      lb.classList.remove('flex');
    }

    document.getElementById('modalNoBtn').addEventListener('click', closeModal);
    document.getElementById('modalYesBtn').addEventListener('click', confirmGift);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeLightbox();
      }
    });

    renderGrid();
  </script>
</body>
</html>
